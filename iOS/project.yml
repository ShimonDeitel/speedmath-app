name: SpeedMath
options:
  bundleIdPrefix: com.deitel
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: W7Q885Q59C        # Joshua Deitel — hardcoded, wrong-team gotcha
    CODE_SIGN_STYLE: Manual             # manual: no signed-in Xcode account in this env to auto-refresh profiles (App Groups needed a portal-side profile regen via the ASC API instead)
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO

schemes:
  SpeedMath:
    build:
      targets:
        SpeedMath: all
        SpeedMathTests: [test]
        SpeedMathUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: SpeedMath.storekit
    test:
      config: Debug
      targets: [SpeedMathTests, SpeedMathUITests]

targets:
  SpeedMath:
    type: application
    platform: iOS
    sources:
      - path: SpeedMath
      - path: Shared
      - path: SpeedMath.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deitel.speedmath
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: SpeedMath/SpeedMath.entitlements
        "PROVISIONING_PROFILE_SPECIFIER[config=Debug]": "SpeedMath Dev"
        "PROVISIONING_PROFILE_SPECIFIER[config=Release]": "SpeedMath AppStore Distribution"
        "CODE_SIGN_IDENTITY[config=Release]": "Apple Distribution"
    info:
      path: SpeedMath/Info.plist
      properties:
        CFBundleDisplayName: SpeedMath
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "SpeedMath uses the microphone in Speed mode so you can say your answer out loud. Audio is processed on your device and is never uploaded."
        NSSpeechRecognitionUsageDescription: "SpeedMath uses on-device speech recognition to turn your spoken answer into a number in Speed mode."
  SpeedMathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpeedMathTests
    dependencies:
      - target: SpeedMath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deitel.speedmath.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SpeedMath.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SpeedMath"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SpeedMathUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpeedMathUITests
    dependencies:
      - target: SpeedMath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deitel.speedmath.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpeedMath

  SpeedMathWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SpeedMathWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deitel.speedmath.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: SpeedMathWidget/SpeedMathWidget.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "SpeedMath Widget Dev"
        SKIP_INSTALL: NO
    info:
      path: SpeedMathWidget/Info.plist
      properties:
        CFBundleDisplayName: SpeedMath
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
